<!doctype html><html><head><meta charset="utf-8">
    <title>My Favourite Movies</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto&display=swap" rel="stylesheet">

    <!-- config.js define TMDB_API_KEY, separado de la lógica de la aplicación -->
    <script src="config.js"></script>

    <style>
        body { --primary: #6200ee; --secondary: #29b6f6; margin: 0px;}
        * {font-family: 'Roboto', sans-serif;}
        button {
            -webkit-font-smoothing: antialiased;
            display: inline-block;
            text-decoration: none;
            margin: 2px;
            color: var(--primary);
            background: white;
            border: 1px solid var(--primary);
            height: 20px;
            font-size: 9px;
            text-transform: uppercase;
            cursor: pointer;
            transition: ease-in 0.2s all;
            padding: 0 8px 0 8px;
        }
        div#main {padding: 10px;}
        input {margin-bottom: 5px; margin-top: 2px; padding: 4px; font-size: 12px; }
        h1 {background: var(--primary); color: white; font-weight: 300; text-transform: uppercase; font-size: 20px; margin: 0px; padding: 15px;}
        h2 { margin-block-start: 0px; margin-block-end: 10px; font-size: 20px;  color: var(--primary);}
        button:hover { background: var(--primary); color: white; }
        button:disabled { opacity: 0.5; cursor: default; background: white; color: var(--primary); }
        div.actions { margin-top: 10px;}
        div.movie {display: inline-block; width: auto; padding: 10px; box-shadow: 2px 2px 7px #ccc; margin: 5px;}
        div.movie div.movie-img {width: 200px; height: auto; min-height: 200px; cursor: pointer;}
        div.movie div.movie-img img {width: 100%; height: auto;}
        div.movie div.title {text-align: center; overflow: hidden; text-overflow: ellipsis; width: 200px; white-space: nowrap; }
        div.field {color: var(--primary); text-transform: uppercase; font-size: 12px;}
        #search-msg {font-size: 13px; color: var(--primary); margin-top: 10px;}
    </style>

    <script type="text/javascript">

       // MODELO DE DATOS

       let initial_movies = [
        { title: "Superlópez", director: "Javier Ruiz Caldera", thumbnail: "files/superlopez.png" },
        { title: "Jurassic Park", director: "Steven Spielberg", thumbnail: "files/jurassicpark.png" },
        { title: "Interstellar", director: "Christopher Nolan", thumbnail: "files/interstellar.png" }
    ];


        localStorage.my_movies = localStorage.my_movies || JSON.stringify(initial_movies);


        // VISTAS
        const indexView = (movies) => {
            let i=0;
            let view = "";

            while(i < movies.length) {
              view += `
                <div class="movie">
                   <div class="movie-img">
                        <img data-my-id="${i}" src="${movies[i].thumbnail}" onerror="this.src='files/noimage.png'"/>
                   </div>
                   <div class="title">
                       ${movies[i].title || "<em>No title</em>"}
                   </div>
                   <div class="actions">
                       <button class="show" data-my-id="${i}">show</button>
                       <button class="edit" data-my-id="${i}">edit</button>
                       <button class="delete" data-my-id="${i}">delete</button>
                    </div>
                </div>\n`;
              i = i + 1;
            };

            view += `<div class="actions">
                        <button class="new">add</button>
                        <button class="search">search tmdb</button>
                        <button class="my-keywords">my keywords</button>
                        <button class="reset">reset</button>
                    </div>`;

            return view;
        };


        const editView = (i, movie) => {
            return `<h2>Edit Movie </h2>
                <div class="field">
                Title <br>
                <input  type="text" id="title" placeholder="Title"
                        value="${movie.title}">
                </div>
                <div class="field">
                Director <br>
                <input  type="text" id="director" placeholder="Director"
                        value="${movie.director}">
                </div>
                <div class="field">
                Thumbnail <br>
                <input  type="text" id="thumbnail" placeholder="Thumbnail URL"
                        value="${movie.thumbnail}">
                </div>
                <div class="actions">
                    <button class="update" data-my-id="${i}">
                        Update
                    </button>
                    <button class="index">
                        Back
                    </button>
               `;
        }


        const showView = (movie) => {
            return `<h2>${movie.title}</h2>
             <p>
                <div class="field">Director</div>
                ${movie.director}
             </p>
             <div class="actions">
                <button class="index">Back</button>
             </div>`;
        }


        const newView = () => {
            return `<h2>Create Movie</h2>
                <div class="field">
                Title <br>
                <input  type="text" id="title" placeholder="Title">
                </div>
                <div class="field">
                Director <br>
                <input  type="text" id="director" placeholder="Director">
                </div>
                <div class="field">
                Thumbnail <br>
                <input  type="text" id="thumbnail" placeholder="Thumbnail URL">
                </div>
                <div class="actions">
                    <button class="create">Create</button>
                    <button class="index">Back</button>
                </div>`;
        }


        // Parte 2: vista de búsqueda
        // Solo el formulario: un campo de texto, un botón de buscar y dos contenedores vacíos
        // (#search-msg para mensajes de estado/error, #search-results para los resultados).
        const searchView = () => {
            return `<h2>Search a movie on TMDb</h2>
                <div class="field">
                Title <br>
                <input type="text" id="query" placeholder="e.g. Titanic">
                </div>
                <div class="actions">
                    <button class="search-submit">Search</button>
                    <button class="index">Back</button>
                </div>
                <div id="search-msg"></div>
                <div id="search-results"></div>`;
        }


        // Parte 2: vista de resultados
        // Recibe el array "results" que devuelve TMDb y lo convierte en HTML.
        const resultsView = (results) => {
            // Si no hay resultados (o la búsqueda falló), mostramos un mensaje simple en vez de una lista vacía.
            if (!results || results.length === 0) {
                return `<p>No results found. Try a different title.</p>`;
            }

            let view = `<div class="results-grid">`;
            let i = 0;
            while (i < results.length) {
                let movie = results[i];

                // TMDb solo nos da el nombre del archivo del póster (poster_path), no la URL completa.
                // Montamos nosotros la URL completa; si no hay póster, usamos noimage.png.
                let poster = movie.poster_path
                    ? `https://image.tmdb.org/t/p/w200${movie.poster_path}`
                    : "files/noimage.png";
                let release = movie.release_date || "Unknown";

                view += `
                    <div class="movie">
                        <div class="movie-img">
                            <img src="${poster}" onerror="this.src='files/noimage.png'"/>
                        </div>
                        <div class="title">${movie.title}</div>
                        <div class="field">Release date</div>
                        ${release}
                        <div class="actions">
                            <button class="add-from-api" data-my-id="${i}">add</button>
                            <button class="keywords" data-my-id="${i}">keywords</button>
                        </div>
                    </div>\n`;
                i = i + 1;
            }
            view += `</div>`;
            return view;
        }


        // Parte 3: vista de palabras clave de una película
        const keywordsView = (movieTitle, keywords) => {
            let view = `<h2>Keywords: ${movieTitle}</h2>`;

            if (!keywords || keywords.length === 0) {
                view += `<p>No keywords found for this movie.</p>`;
            } else {
                let i = 0;
                while (i < keywords.length) {
                    view += `
                        <div class="movie">
                            <div class="title">${keywords[i]}</div>
                            <div class="actions">
                                <button class="add-keyword" data-my-id="${i}">Añadir a mi lista</button>
                            </div>
                        </div>\n`;
                    i = i + 1;
                }
            }

            view += `<div class="actions">
                        <button class="index">Back</button>
                    </div>`;
            return view;
        }


        // Parte 3: vista de mi lista personalizada de palabras clave
        const myKeywordsView = () => {
            let my_keywords = JSON.parse(localStorage.my_keywords || "[]");
            let view = `<h2>Mi lista de palabras clave</h2>`;

            if (my_keywords.length === 0) {
                view += `<p>Todavía no has añadido ninguna palabra clave.</p>`;
            } else {
                let i = 0;
                while (i < my_keywords.length) {
                    view += `
                        <div class="movie">
                            <div class="title">${my_keywords[i]}</div>
                            <div class="actions">
                                <button class="remove-keyword" data-my-id="${i}">Eliminar</button>
                            </div>
                        </div>\n`;
                    i = i + 1;
                }
            }

            view += `<div class="actions">
                        <button class="index">Back</button>
                    </div>`;
            return view;
        }



        // CONTROLADORES
        const indexContr = () => {
         let my_movies = JSON.parse(localStorage.my_movies);
         document.getElementById('main').innerHTML = indexView(my_movies);
         };


        const showContr = (i) => {
            let movie = JSON.parse(localStorage.my_movies)[i];
            document.getElementById('main').innerHTML = showView(movie);
        };

        const newContr = () => {
            document.getElementById('main').innerHTML = newView();
        };

        const createContr = () => {
            let my_movies = JSON.parse(localStorage.my_movies);
            let newMovie = {
                title:     document.getElementById('title').value,
                director:  document.getElementById('director').value,
                thumbnail: document.getElementById('thumbnail').value
            };
            my_movies.push(newMovie);
            localStorage.my_movies = JSON.stringify(my_movies);
            indexContr();
        };

        const editContr = (i) => {
            let movie = JSON.parse(localStorage.my_movies)[i];
            document.getElementById('main').innerHTML = editView(i, movie);
        };


        const updateContr = (i) => {
            let my_movies = JSON.parse(localStorage.my_movies);
            my_movies[i].title    = document.getElementById('title').value;
            my_movies[i].director  = document.getElementById('director').value;
            my_movies[i].thumbnail = document.getElementById('thumbnail').value;
            localStorage.my_movies = JSON.stringify(my_movies);
            indexContr();
        };


        const deleteContr = (i) => {
            if (confirm('Are you sure you want to delete this movie?')) {
                let my_movies = JSON.parse(localStorage.my_movies);
                my_movies.splice(i, 1);
                localStorage.my_movies = JSON.stringify(my_movies);
                indexContr();
            }
        };


        const resetContr = () => {
            localStorage.my_movies = JSON.stringify(initial_movies);
            indexContr();
        };


        // Parte 2: controladores

        // Muestra el formulario de búsqueda
        const searchFormContr = () => {
            document.getElementById('main').innerHTML = searchView();
        };

        // Guarda los últimos resultados de búsqueda en memoria para que addFromAPIContr(i)
        // pueda encontrar el objeto película completo sobre el que se pulsó "add".
        let lastSearchResults = [];

        // "async" nos deja usar "await" dentro: la función se para en cada await
        // hasta que esa promesa se resuelve, en vez de usar cadenas de .then().
        const searchContr = async (query) => {
            let msg = document.getElementById('search-msg');
            let resultsBox = document.getElementById('search-results');

            // Validamos el campo antes de hacer nada más: no se permiten búsquedas vacías.
            if (!query || query.trim() === "") {
                msg.innerText = "Please type a movie title to search.";
                return;
            }

            // Avisamos al usuario de que algo está pasando mientras esperamos la respuesta de TMDb.
            msg.innerText = "Searching...";
            resultsBox.innerHTML = "";

            // El mismo objeto options que muestra el enunciado de la actividad, pero con nuestra propia clave.
            const options = {
                method: 'GET',
                headers: {
                    accept: 'application/json',
                    Authorization: 'Bearer ' + TMDB_API_KEY
                }
            };

            // try/catch para que un error de red o una clave inválida no rompan la página:
            // simplemente cae en el bloque catch y se muestra un mensaje en vez de un error.
            try {
                // Mismo patrón de URL que muestra el enunciado de la actividad: URL base + query.
                let response = await fetch(
                    'https://api.themoviedb.org/3/search/movie?query=' + query,
                    options
                );

                // fetch() NO lanza un error por sí solo si la respuesta tiene un estado HTTP malo (como 401 o 404),
                // así que comprobamos response.ok nosotros mismos y lanzamos nuestro propio error si algo va mal.
                if (!response.ok) {
                    throw new Error('TMDb request failed with status ' + response.status);
                }

                // response.json() también es una promesa, así que también la esperamos con "await".
                let data = await response.json();

                // Guardamos los resultados en una variable fuera de esta función (lastSearchResults),
                // porque addFromAPIContr() necesitará luego el objeto película completo, no solo su id.
                lastSearchResults = data.results || [];

                if (lastSearchResults.length === 0) {
                    msg.innerText = "No movies found for \"" + query + "\".";
                } else {
                    msg.innerText = "";
                }
                resultsBox.innerHTML = resultsView(lastSearchResults);

            } catch (err) {
                // Llega aquí si: no hay internet, hay problemas de CORS, la clave no es válida, o por el throw de arriba.
                msg.innerText = "Something went wrong while searching TMDb. Check your internet connection or API key.";
                console.error(err);
            }
        };


        // "i" es la posición de la película pulsada dentro de lastSearchResults.
        // "btn" es el propio botón, para poder desactivarlo/reactivarlo.
        const addFromAPIContr = async (i, btn) => {
            let movie = lastSearchResults[i];
            if (!movie) return; // comprobación de seguridad, no debería pasar normalmente

            // Desactivamos el botón enseguida para que un doble clic no añada la película dos veces.
            btn.disabled = true;

            let my_movies = JSON.parse(localStorage.my_movies);

            // Recorremos el array a mano (mismo estilo que los demás bucles de este archivo)
            // para comprobar si ya hay guardada una película con este mismo título.
            let alreadyExists = false;
            let j = 0;
            while (j < my_movies.length) {
                if (my_movies[j].title === movie.title) {
                    alreadyExists = true;
                }
                j = j + 1;
            }

            if (alreadyExists) {
                alert('"' + movie.title + '" is already in your local database.');
                btn.disabled = false; // la reactivamos, no se ha añadido nada
                return;
            }

            // TMDb no nos da el director, así que guardamos "Unknown" de momento
            // (siempre se puede corregir luego con el botón "edit").
            let newMovie = {
                title: movie.title,
                director: "Unknown",
                thumbnail: movie.poster_path
                    ? 'https://image.tmdb.org/t/p/w200' + movie.poster_path
                    : 'files/noimage.png'
            };

            my_movies.push(newMovie);
            localStorage.my_movies = JSON.stringify(my_movies);

            alert('"' + movie.title + '" was added to your local database.');
            indexContr(); // volvemos a la lista principal, donde ya aparece la nueva película
        };


        // Parte 3: controladores de palabras clave

        // Limpia una palabra clave: quita caracteres especiales, espacios sobrantes
        // y la pasa a minúsculas, para evitar duplicados. Tal cual el ejemplo del enunciado.
        const cleanKeyword = (keyword) => {
            return keyword
                .replace(/[^a-zñáéíóú0-9 ]+/igm, "") // quita caracteres especiales
                .trim() // quita espacios al principio y al final
                .toLowerCase(); // pasa a minúsculas
        };

        // Recorre el array de palabras clave que devuelve TMDb (cada una es un objeto
        // con "id" y "name"), limpia cada "name" con cleanKeyword y evita duplicados,
        // igual que hacemos con las películas en addFromAPIContr.
        const processKeywords = (keywords) => {
            let clean_list = [];
            let i = 0;
            while (i < keywords.length) {
                let word = cleanKeyword(keywords[i].name);

                let alreadyInList = false;
                let j = 0;
                while (j < clean_list.length) {
                    if (clean_list[j] === word) {
                        alreadyInList = true;
                    }
                    j = j + 1;
                }

                if (word !== "" && !alreadyInList) {
                    clean_list.push(word);
                }
                i = i + 1;
            }
            return clean_list;
        };

        // Guarda las palabras clave que se muestran ahora mismo, para que
        // addKeywordToList(i) pueda usar el texto exacto del botón pulsado.
        let lastKeywords = [];

        const keywordsContr = (i) => {
            let movie = lastSearchResults[i];
            if (!movie) return;

            const options = {
                method: 'GET',
                headers: {
                    accept: 'application/json',
                    Authorization: 'Bearer ' + TMDB_API_KEY
                }
            };

            // Mismo patrón que muestra el enunciado: fetch + .then + .catch.
            fetch('https://api.themoviedb.org/3/movie/' + movie.id + '/keywords', options)
                .then(response => response.json())
                .then(response => {
                    lastKeywords = processKeywords(response.keywords);
                    document.getElementById('main').innerHTML = keywordsView(movie.title, lastKeywords);
                })
                .catch(err => console.error(err));
        };

        const addKeywordToList = (i) => {
            let keyword = lastKeywords[i];
            if (!keyword) return;

            let my_keywords = JSON.parse(localStorage.my_keywords || "[]");

            let alreadyExists = false;
            let j = 0;
            while (j < my_keywords.length) {
                if (my_keywords[j] === keyword) {
                    alreadyExists = true;
                }
                j = j + 1;
            }

            if (alreadyExists) {
                alert('"' + keyword + '" ya está en tu lista.');
                return;
            }

            my_keywords.push(keyword);
            localStorage.my_keywords = JSON.stringify(my_keywords);
            alert('"' + keyword + '" añadida a tu lista.');
        };

        const myKeywordsContr = () => {
            document.getElementById('main').innerHTML = myKeywordsView();
        };

        const removeKeywordContr = (i) => {
            let my_keywords = JSON.parse(localStorage.my_keywords || "[]");
            my_keywords.splice(i, 1);
            localStorage.my_keywords = JSON.stringify(my_keywords);
            myKeywordsContr();
        };


        // ENRUTADOR DE EVENTOS
        const matchEvent = (ev, sel) => ev.target.matches(sel);
        const myId = (ev) => Number(ev.target.dataset.myId);

        document.addEventListener('click', ev => {
            if      (matchEvent(ev, '.index'))  indexContr  ();
            else if (matchEvent(ev, '.edit'))   editContr   (myId(ev));
            else if (matchEvent(ev, '.update')) updateContr (myId(ev));
            else if (matchEvent(ev, '.show'))   showContr   (myId(ev));
            else if (matchEvent(ev, '.new'))    newContr    ();
            else if (matchEvent(ev, '.create')) createContr ();
            else if (matchEvent(ev, '.delete')) deleteContr (myId(ev));
            else if (matchEvent(ev, '.reset'))  resetContr  ();
            // Parte 2: nuevos eventos para la función de búsqueda en TMDb.
            // "search"        -> abre el formulario de búsqueda (searchView)
            // "search-submit" -> lanza la búsqueda en TMDb con lo que haya escrito en #query
            // "add-from-api"  -> añade uno de los resultados a nuestra base de datos local
            else if (matchEvent(ev, '.search')) searchFormContr();
            else if (matchEvent(ev, '.search-submit')) {
                searchContr(document.getElementById('query').value);
            }
            else if (matchEvent(ev, '.add-from-api')) {
                addFromAPIContr(myId(ev), ev.target);
            }
            // Parte 3: nuevos eventos para las palabras clave
            // "keywords"      -> consulta las palabras clave de la película en TMDb (keywordsContr)
            // "add-keyword"   -> añade la palabra clave pulsada a nuestra lista personalizada
            // "my-keywords"   -> muestra la lista personalizada de palabras clave
            // "remove-keyword"-> elimina una palabra clave de la lista personalizada
            else if (matchEvent(ev, '.keywords')) {
                keywordsContr(myId(ev));
            }
            else if (matchEvent(ev, '.add-keyword')) {
                addKeywordToList(myId(ev));
            }
            else if (matchEvent(ev, '.my-keywords')) {
                myKeywordsContr();
            }
            else if (matchEvent(ev, '.remove-keyword')) {
                removeKeywordContr(myId(ev));
            }
        });

        // Extra: pulsar "Enter" mientras se escribe en el campo de búsqueda también lanza la búsqueda,
        // así el usuario no tiene que ir siempre al botón "Search".
        document.addEventListener('keydown', ev => {
            if (ev.key === 'Enter' && ev.target.id === 'query') {
                searchContr(document.getElementById('query').value);
            }
        });


        // Inicialización
        document.addEventListener('DOMContentLoaded', indexContr);
    </script>
</head>

<body>

    <h1>My Favourite Movies</h1>
    <div id="main"> <!-- Aquí se inserta la vista --> </div>


</body>
</html>
